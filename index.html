<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кузнєцов Владислав Юрійович, ІС-44, ЛР-2, Варіант 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Завдання 1: Таблиця за Варіантом 7</h2>
    <table>
        <!-- 1-й рядок: ПІБ (розбите по комірках з урахуванням макета) -->
        <tr class="row-1">
            <td rowspan="2" colspan="2">Кузнєцов Владислав Юрійович</td>
            <td>ІС-44</td>
            <td>ЛР-2</td>
        </tr>
        <tr class="row-1">
            <td>Варіант 7</td>
            <td>КПІ</td>
        </tr>
        <!-- 2-й рядок та наступні згідно структури макета -->
        <tr class="row-2">
            <td colspan="2">Факультет ІСТ</td>
            <td rowspan="2">CSS / HTML</td>
            <td>Таблиці</td>
        </tr>
        <tr class="row-2">
            <td>Frontend</td>
            <td>Лабораторна 2</td>
            <td>Готово</td>
        </tr>
    </table>

    <hr style="margin: 40px 0;">

    <h2>Завдання 2: Годинник засобами CSS (Варіант 7)</h2>
    <div class="clock-container">
        <!-- Циферблат годинника -->
        <div class="clock-face">
            <!-- 4 червоні точки на циферблаті -->
            <div class="dot top"></div>
            <div class="dot right"></div>
            <div class="dot bottom"></div>
            <div class="dot left"></div>

            <!-- Стрілки годинника -->
            <div class="hand minute-hand"></div>
            <div class="hand hour-hand"></div>
        </div>
    </div>

</body>
</html>
